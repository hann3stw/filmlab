# Builds FilmLab and publishes it to GitHub Pages on every push.
# WebUSB only works over HTTPS — GitHub Pages gives us HTTPS for free.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'ccr-*']
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # FilmLab moved to https://filmlab-app.github.io/ — this old address
      # now only serves a redirect page (folder moved/), no app build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: moved

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
